name: Prepare Salut release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Test and release Salut"]
    types: [completed]
    branches: ["salut/release/v*"]

permissions:
  contents: read
  actions: write
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: salut-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'akunilovskii/salut' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Authorize release pull requests in this repository
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SALUT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SALUT_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Continue or prepare biweekly release
        env:
          GH_TOKEN: ${{ github.token }}
          SALUT_RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          SALUT_RELEASE_PR_TOKEN: ${{ steps.release-app.outputs.token }}
        run: python3 -m tools.release_train prepare
