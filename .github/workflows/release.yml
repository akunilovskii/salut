name: Test and release Salut

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope (release retry runs on main)
        type: choice
        default: full-offline
        options:
          - required
          - full-offline
          - worker-benchmark
          - build-image
          - release-retry

permissions:
  contents: read

concurrency:
  group: salut-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/akunilovskii/salut-build@sha256:b78be3c132cf30006095144240ec6cb58f01141ac6ba9107ca866ccbbcff1146
    timeout-minutes: 45
    env:
      SALUT_CACHE_NAMESPACE: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ci-bench/') && 'salut-benchmark-deps-v1' || 'salut-deps-v1' }}
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check release tooling
        run: bash tools/test_release_tooling.sh
      - name: Restore dependency cache
        id: dependencies
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/gradle-user-home/caches/modules-2
            build/gradle-user-home/wrapper
            build/robolectric-maven
          key: ${{ env.SALUT_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'personal/robolectric-runtimes.json') }}
          restore-keys: ${{ env.SALUT_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-java21-
      - name: Verify and prepare Robolectric runtimes
        run: python -B tools/ci_robolectric.py
      - name: Check application
        id: application
        shell: pwsh
        env:
          SALUT_VALIDATION: ${{ inputs.validation || 'full-offline' }}
        run: |
          $testArguments = @{}
          if ($env:SALUT_VALIDATION -eq 'required') {
            $testArguments.Fast = $true
          }
          ./personal/tools/Test.ps1 @testArguments
      - name: Report proposed PR test selection
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: python -X utf8 -m tools.ci_shadow_plan
      - name: Preserve proposed PR test selection
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('build/maintenance/shadow-test-plan.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-test-plan
          retention-days: 7
          path: build/maintenance/shadow-test-plan.json
      - name: Save trusted dependency cache
        if: ${{ success() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ci-bench/'))) }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/gradle-user-home/caches/modules-2
            build/gradle-user-home/wrapper
            build/robolectric-maven
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve execution evidence
        if: ${{ always() && steps.application.outcome != 'skipped' && steps.application.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-execution-evidence
          retention-days: 7
          path: build/maintenance/test-metrics.json
      - name: Preserve failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-diagnostics
          retention-days: 7
          path: |
            smarttubetv/build/test-results/
            common/build/test-results/
            MediaServiceCore/youtubeapi/build/test-results/
            build/maintenance/tests-*.log

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'worker-benchmark' && startsWith(github.ref, 'refs/heads/ci-bench/workers') }}
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/akunilovskii/salut-build@sha256:b78be3c132cf30006095144240ec6cb58f01141ac6ba9107ca866ccbbcff1146
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Qualify full-suite worker reuse
        shell: pwsh
        run: ./personal/tools/Benchmark-CI.ps1
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-worker-benchmark
          retention-days: 7
          path: build/maintenance/ci-benchmark/

  release-plan:
    if: >-
      github.repository == 'akunilovskii/salut' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.validation == 'release-retry')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select merged release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ inputs.validation }}
        run: |
          if [ "$VALIDATION" = release-retry ]; then
            python -m tools.release_train select --retry
          else
            python -m tools.release_train select
          fi

  release:
    if: needs.release-plan.outputs.tag != ''
    needs: release-plan
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/akunilovskii/salut-build@sha256:b78be3c132cf30006095144240ec6cb58f01141ac6ba9107ca866ccbbcff1146
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-plan.outputs.revision }}
          persist-credentials: false
      - name: Check release tooling on the original revision
        if: needs.release-plan.outputs.revision != github.sha
        run: bash tools/test_release_tooling.sh
      - name: Test the original release revision on recovery
        if: needs.release-plan.outputs.revision != github.sha
        shell: pwsh
        run: ./personal/tools/Test.ps1
      - name: Prepare version-specific release notes
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: python -X utf8 -m tools.release_notes --tag "$RELEASE_TAG" --out build/maintenance/release-notes.md
      - name: Restore signing key
        shell: pwsh
        env:
          SALUT_SIGNING_KEY_BASE64: ${{ secrets.SALUT_SIGNING_KEY_BASE64 }}
        run: |
          if (-not $env:SALUT_SIGNING_KEY_BASE64) { throw 'Release signing secret is missing' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'salut-signing.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SALUT_SIGNING_KEY_BASE64))
          "SALUT_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          ./personal/tools/Build.ps1 -Tasks ':smarttubetv:assembleStmobileRelease' -GradleArguments '-PsalutRelease'
          python -X utf8 tools/verify_release.py --tag "$env:RELEASE_TAG" --dist smarttubetv/build/outputs/renamed_apks/stmobileRelease
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - name: Install release client in the build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_REVISION: ${{ needs.release-plan.outputs.revision }}
        run: python -m tools.release_train publish --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"

  build-image:
    if: ${{ github.repository == 'akunilovskii/salut' && github.event_name == 'workflow_dispatch' && inputs.validation == 'build-image' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish build environment
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: personal/container
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akunilovskii/salut-build:sha-${{ github.sha }}
      - name: Record immutable image reference
        shell: pwsh
        env:
          SALUT_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          New-Item -ItemType Directory -Force -Path build/maintenance | Out-Null
          @{ image = "ghcr.io/akunilovskii/salut-build@$env:SALUT_IMAGE_DIGEST"; recipeSha256 = (Get-FileHash personal/container/Dockerfile -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content build/maintenance/build-image.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-image-reference
          retention-days: 30
          path: build/maintenance/build-image.json
