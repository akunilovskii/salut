name: Test and release Salut

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salut-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android platform
        shell: pwsh
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Check release tooling and application
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s tools/tests
          if ($LASTEXITCODE) { throw 'Release tooling tests failed' }
          ./personal/tools/Test.ps1
      - name: Preserve failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-diagnostics
          retention-days: 7
          path: |
            smarttubetv/build/test-results/
            common/build/test-results/
            build/maintenance/tests-*.log

  release:
    if: github.repository == 'akunilovskii/salut' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android platform
        shell: pwsh
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Prepare version-specific release notes
        shell: pwsh
        run: |
          python -X utf8 -m tools.release_notes --tag "$env:GITHUB_REF_NAME" --out build/maintenance/release-notes.md
          if ($LASTEXITCODE) { throw 'Release notes preparation failed' }
      - name: Restore signing key
        shell: pwsh
        env:
          SALUT_SIGNING_KEY_BASE64: ${{ secrets.SALUT_SIGNING_KEY_BASE64 }}
        run: |
          if (-not $env:SALUT_SIGNING_KEY_BASE64) { throw 'Release signing secret is missing' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'salut-signing.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SALUT_SIGNING_KEY_BASE64))
          "SALUT_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify release
        shell: pwsh
        run: |
          ./personal/tools/Build.ps1 -Tasks ':smarttubetv:assembleStmobileRelease' -GradleArguments '-PsalutRelease'
          python -X utf8 tools/verify_release.py --tag "$env:GITHUB_REF_NAME" --dist smarttubetv/build/outputs/renamed_apks/stmobileRelease
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = 'smarttubetv/build/outputs/renamed_apks/stmobileRelease'
          $assets = @(Get-ChildItem -LiteralPath $dist -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --latest --title "Salut $($env:GITHUB_REF_NAME)" --notes-file 'build/maintenance/release-notes.md'
          if ($LASTEXITCODE) { throw 'Release publication failed' }
