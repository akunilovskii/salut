name: Test and release Salut

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salut-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SALUT_CACHE_NAMESPACE: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ci-bench/') && 'salut-benchmark-deps-v1' || 'salut-deps-v1' }}
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release tooling
        run: python -X utf8 -m unittest discover -s tools/tests
      - name: Restore dependency cache
        id: dependencies
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/gradle-user-home/caches/modules-2
            build/gradle-user-home/wrapper
            build/robolectric-maven
          key: ${{ env.SALUT_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ env.SALUT_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-java21-
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android platform
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE) { throw 'Android platform installation failed' }
      - name: Check application
        id: application
        shell: pwsh
        run: |
          ./personal/tools/Test.ps1 -ForceExecution
      - name: Save trusted dependency cache
        if: ${{ success() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ci-bench/'))) }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/gradle-user-home/caches/modules-2
            build/gradle-user-home/wrapper
            build/robolectric-maven
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve execution evidence
        if: ${{ always() && steps.application.outcome != 'skipped' && steps.application.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-execution-evidence
          retention-days: 7
          path: build/maintenance/test-metrics.json
      - name: Preserve failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-diagnostics
          retention-days: 7
          path: |
            smarttubetv/build/test-results/
            common/build/test-results/
            MediaServiceCore/youtubeapi/build/test-results/
            build/maintenance/tests-*.log

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/ci-bench/workers') }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android platform
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE) { throw 'Android platform installation failed' }
      - name: Qualify full-suite worker reuse
        shell: pwsh
        run: ./personal/tools/Benchmark-CI.ps1
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-worker-benchmark
          retention-days: 7
          path: build/maintenance/ci-benchmark/

  release:
    if: github.repository == 'akunilovskii/salut' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android platform
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE) { throw 'Android platform installation failed' }
      - name: Prepare version-specific release notes
        shell: pwsh
        run: |
          python -X utf8 -m tools.release_notes --tag "$env:GITHUB_REF_NAME" --out build/maintenance/release-notes.md
          if ($LASTEXITCODE) { throw 'Release notes preparation failed' }
      - name: Restore signing key
        shell: pwsh
        env:
          SALUT_SIGNING_KEY_BASE64: ${{ secrets.SALUT_SIGNING_KEY_BASE64 }}
        run: |
          if (-not $env:SALUT_SIGNING_KEY_BASE64) { throw 'Release signing secret is missing' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'salut-signing.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SALUT_SIGNING_KEY_BASE64))
          "SALUT_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify release
        shell: pwsh
        run: |
          ./personal/tools/Build.ps1 -Tasks ':smarttubetv:assembleStmobileRelease' -GradleArguments '-PsalutRelease'
          python -X utf8 tools/verify_release.py --tag "$env:GITHUB_REF_NAME" --dist smarttubetv/build/outputs/renamed_apks/stmobileRelease
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = 'smarttubetv/build/outputs/renamed_apks/stmobileRelease'
          $assets = @(Get-ChildItem -LiteralPath $dist -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --latest --title "Salut $($env:GITHUB_REF_NAME)" --notes-file 'build/maintenance/release-notes.md'
          if ($LASTEXITCODE) { throw 'Release publication failed' }
